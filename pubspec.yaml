name: ytdown
description: YouTube downloader app with yt-dlp + ffmpeg

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Compartilhamento de links
  receive_sharing_intent: ^1.8.1
  flutter_inappwebview: ^6.1.5
  http: ^1.2.2

  # Notificações
  flutter_local_notifications: ^21.0.0
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.15

  # Permissões
  permission_handler: ^12.0.1

  # Armazenamento de downloads
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2

  # Utilitários
  uuid: ^4.4.0
  crypto: ^3.0.3
  intl: ^0.20.2
  url_launcher: ^6.3.0
  share_plus: ^13.0.0
  open_file: ^3.5.11
  firebase_core: ^4.6.0
  firebase_crashlytics: ^5.1.0
  logger: ^2.7.0
  flutter_riverpod: ^3.3.1
  animated_list_plus: ^0.5.2
  flutter_foreground_task: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+2

flutter:
  uses-material-design: true
  assets:
    - assets/python/cacert.pem
