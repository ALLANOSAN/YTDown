buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://chaquo.com/maven") }
    }
    dependencies {
        classpath "com.chaquo.python:gradle:15.0.1"
        classpath "com.android.tools.build:gradle:8.11.1"
    }
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "kotlin-kapt"
    id "com.google.dagger.hilt.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

apply plugin: "com.chaquo.python"

android {
    namespace = "com.example.ytdown"
    compileSdk 34

    // Leitura de secrets via Regex para evitar erros de resolução da IDE com JsonSlurper
    def secretsFile = rootProject.file("../.secrets.json")
    def lastFmKey = ""
    if (secretsFile.exists()) {
        def matcher = secretsFile.text =~ /"LASTFM_API_KEY"\s*:\s*"([^"]+)"/
        if (matcher.find()) lastFmKey = matcher.group(1)
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_20
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.3"
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-options"
    }
    
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_20
        }
    }

    defaultConfig {
        applicationId = "com.seuapp.yt"
        minSdk = 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Injetando secrets no BuildConfig
        buildConfigField "String", "LASTFM_API_KEY", "\"${lastFmKey}\""

        ndk {
            // Python 3.12 só suporta arm64-v8a e x86_64
            abiFilters "arm64-v8a", "x86_64"
        }
        
        // Chaquo Python configuration
        python {
            version "3.12"
            buildPython "/usr/bin/python3.12"
            pip {
                install "yt-dlp>=2026.3.0"
                install "mutagen"
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".native"
            versionNameSuffix "-native"
        }
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

// Desabilita Google Services no Debug para permitir o sufixo .native (Side-by-Side)
project.afterEvaluate {
    tasks.matching { it.name.contains("processDebugGoogleServices") }.configureEach {
        it.enabled = false
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.compose.ui:ui:1.5.3"
    implementation "androidx.compose.ui:ui-tooling-preview:1.5.3"
    implementation "androidx.compose.material3:material3:1.2.0"
    implementation "androidx.compose.material3:material3-window-size-class:1.2.0"
    implementation "androidx.compose.material:material-icons-extended:1.5.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2"
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    implementation "androidx.work:work-runtime-ktx:2.8.1"
    implementation "com.google.dagger:hilt-android:2.48"
    kapt "com.google.dagger:hilt-android-compiler:2.48"
    implementation "androidx.hilt:hilt-work:1.0.0"
    kapt "androidx.hilt:hilt-compiler:1.0.0"
    implementation "io.coil-kt:coil-compose:2.5.0"
    implementation "androidx.media3:media3-exoplayer:1.2.1"
    implementation "androidx.media3:media3-session:1.2.1"
    implementation "androidx.media3:media3-common:1.2.1"
    implementation "androidx.hilt:hilt-navigation-compose:1.1.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
