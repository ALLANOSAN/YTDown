name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Testes Python (Chaquopy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mesma lista do bloco chaquopy.pip em android/app/build.gradle, menos
      # yt-dlp (baixado em runtime). metal_archives.py importa bs4 e cloudscraper
      # no topo, e ytdown.py importa metal_archives — sem eles a suíte nem carrega.
      - name: Instalar dependências
        run: pip install mutagen requests beautifulsoup4 cloudscraper

      # Sem pytest.ini nem tests/__init__.py a descoberta automática falha;
      # cada arquivo é executado direto, e o loop propaga a primeira falha.
      - name: Rodar suíte
        working-directory: android/app/src/main/python
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "== $t"
            PYTHONPATH=. python "$t"
          done

  android:
    name: Lint, testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-scan-publish: false

      # .secrets.json e google-services.json são git-ignored e obrigatórios para
      # o build. Sem recriá-los aqui o CI falhava sempre: o plugin do Firebase
      # derruba o assembleDebug e o BuildConfigSecretsTest quebra por chave vazia.
      # Os secrets do repo são usados quando existem; senão entram placeholders
      # sintáticamente válidos, suficientes para compilar e testar.
      - name: Preparar secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          FANARTTV_API_KEY: ${{ secrets.FANARTTV_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cat > .secrets.json <<EOF
          {
            "LASTFM_API_KEY": "${LASTFM_API_KEY:-00000000000000000000000000000000}",
            "FANARTTV_API_KEY": "${FANARTTV_API_KEY:-00000000000000000000000000000000}"
          }
          EOF
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ytdown-ci",
              "storage_bucket": "ytdown-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.example.ytdown" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCI00000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                  "android_client_info": { "package_name": "com.example.ytdown.native" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCI00000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: ktlint
        run: ./gradlew ktlintCheck
        working-directory: android

      - name: Lint
        run: ./gradlew lintDebug
        working-directory: android

      # jacocoTestReport depende de testDebugUnitTest, então roda a suíte junto.
      - name: Testes unitários + cobertura
        run: ./gradlew jacocoTestReport
        working-directory: android

      - name: Relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/reports/jacoco/jacocoTestReport

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
