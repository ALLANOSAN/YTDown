plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.devtools.ksp"                // substituiu kotlin-kapt
    id "com.google.dagger.hilt.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "com.chaquo.python"
}

// Substituiu o bloco kapt {} — KSP usa arg() diretamente
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

android {
    namespace = "com.example.ytdown"
    compileSdk = 34

    // Leitura de secrets via Regex para evitar erros de resolução da IDE com JsonSlurper
    def secretsFile = rootProject.file("../.secrets.json")
    def lastFmKey = ""
    if (secretsFile.exists()) {
        def matcher = secretsFile.text =~ /"LASTFM_API_KEY"\s*:\s*"([^"]+)"/
        if (matcher.find()) lastFmKey = matcher.group(1)
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "21"
        freeCompilerArgs += ["-Xjdk-release=21"]
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.seuapp.yt"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0.0"

        buildConfigField "String", "LASTFM_API_KEY", "\"${lastFmKey}\""

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            version = "3.14"
            buildPython "/usr/bin/python3.14"
            pip {
                install("yt-dlp>=2026.3.0")
                install("mutagen")
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".native"
            versionNameSuffix "-native"
        }
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-options"
}

// Desabilita Google Services no Debug para permitir o sufixo .native (Side-by-Side)
project.afterEvaluate {
    tasks.matching { it.name.contains("processDebugGoogleServices") }.configureEach {
        it.enabled = false
    }
}

dependencies {
    // Core
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.activity:activity-compose:1.8.2"

    // Compose
    implementation "androidx.compose.ui:ui:1.5.3"
    implementation "androidx.compose.ui:ui-tooling-preview:1.5.3"
    implementation "androidx.compose.material3:material3:1.2.0"
    implementation "androidx.compose.material3:material3-window-size-class:1.2.0"
    implementation "androidx.compose.material:material-icons-extended:1.5.3"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-process:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2"

    // Room — compilador via KSP
    implementation "androidx.room:room-runtime:2.6.1"
    ksp           "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    implementation "androidx.room:room-paging:2.6.1"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.8.1"

    // Hilt — compiladores via KSP (requer hilt-compiler 1.2.0+ para KSP)
    implementation "com.google.dagger:hilt-android:2.51.1"
    ksp           "com.google.dagger:hilt-android-compiler:2.51.1"
    implementation "androidx.hilt:hilt-work:1.2.0"
    ksp           "androidx.hilt:hilt-compiler:1.2.0"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    // Imagem
    implementation "io.coil-kt:coil-compose:2.5.0"

    // Media3 / ExoPlayer
    implementation "androidx.media3:media3-exoplayer:1.2.1"
    implementation "androidx.media3:media3-session:1.2.1"
    implementation "androidx.media3:media3-common:1.2.1"

    // Rede
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.google.code.gson:gson:2.10.1"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Navegação
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // Desugaring (suporte a APIs Java 8+ em versões antigas de Android)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:32.7.0")
    implementation "com.google.firebase:firebase-crashlytics-ktx"
    implementation "com.google.firebase:firebase-analytics-ktx"
}
