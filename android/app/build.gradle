plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.devtools.ksp"                // substituiu kotlin-kapt
    id "com.google.dagger.hilt.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "com.chaquo.python"
    id("org.jlleitschuh.gradle.ktlint") version "12.1.0"
}

// Substituiu o bloco kapt {} — KSP usa arg() diretamente
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
    arg("room.incremental", "true")
    arg("room.expandProjection", "true")
}

android {
    namespace = "com.example.ytdown"
    compileSdk = 37

    // Leitura de secrets via Regex para evitar erros de resolução da IDE com JsonSlurper
    def secretsFile = rootProject.file("../.secrets.json")
    def lastFmKey = ""
    if (secretsFile.exists()) {
        def matcher = secretsFile.text =~ /"LASTFM_API_KEY"\s*:\s*"([^"]+)"/
        if (matcher.find()) lastFmKey = matcher.group(1)
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }


    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.example.ytdown"
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "LASTFM_API_KEY", "\"${lastFmKey}\""

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            version = "3.14"
            buildPython "python3.14"
            pip {
                install("yt-dlp")
                install("mutagen")
                install("requests")
                install("beautifulsoup4")
                install("cloudscraper")
            }
        }
    }

    sourceSets {
        // Permite que o Room e ferramentas de teste acessem os schemas exportados
        // Essencial para validar a integridade sem destruir dados
        debug.assets.srcDirs += files("$projectDir/schemas")
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    testOptions {
        unitTests {
            // Sem isto, android.util.Log lanca em teste JVM. Como o collect do
            // MusicPlayerManager loga antes de gravar em SharedPreferences, a
            // excecao matava a corrotina e as verificacoes nunca aconteciam.
            returnDefaultValues = true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".native"
            versionNameSuffix "-native"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-options"
}

dependencies {
    // Core
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.activity:activity-compose:1.13.0"

    // Compose BOM (Última estável para AGP 8)
    def composeBom = platform("androidx.compose:compose-bom:2026.08.00")
    implementation composeBom
    androidTestImplementation composeBom

    // Compose (Versões gerenciadas pelo BOM)
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation "androidx.compose.material3:material3-window-size-class"
    implementation "androidx.compose.material:material-icons-extended"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-process:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"

    // Room & Paging
    implementation "androidx.room:room-runtime:2.8.4"
    ksp           "androidx.room:room-compiler:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"
    implementation "androidx.room:room-paging:2.8.4"
    implementation "androidx.paging:paging-runtime:3.5.1"
    implementation "androidx.paging:paging-compose:3.5.1"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.11.2"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.60.1"
    ksp           "com.google.dagger:hilt-android-compiler:2.60.1"
    implementation "androidx.hilt:hilt-work:1.4.0"
    ksp           "androidx.hilt:hilt-compiler:1.4.0"
    implementation "androidx.hilt:hilt-navigation-compose:1.4.0"

    // Imagem
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "androidx.palette:palette-ktx:1.0.0"

    // DocumentFile (Essencial para SAF/Escanear pastas externas)
    implementation "androidx.documentfile:documentfile:1.1.0"

    // Media Session (Legacy fallback / Compat)
    implementation "androidx.media:media:1.7.0"

    // Media3 Session (Android 16 Live Island / Now Bar + Modern MediaSession)
    def media3_version = "1.11.0"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"

    // Rede & Serialização
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "org.jsoup:jsoup:1.18.1"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"

    // Testes
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.14.2"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"

    // Navegação
    implementation "androidx.navigation:navigation-compose:2.9.8"

    // Desugaring (Suporte Java 21)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:33.9.0")
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "com.google.firebase:firebase-analytics"
}
